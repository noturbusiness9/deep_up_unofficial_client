name: release

# Сборка macOS-приложения в чистом окружении GitHub: в бинарник не попадают
# локальные пути и имя пользователя автора. Запуск — пушем тега v*.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install frontend deps
        working-directory: app
        run: npm install

      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: app
          args: --target universal-apple-darwin
          tagName: ${{ github.ref_name }}
          releaseName: Cube Remote ${{ github.ref_name }}
          releaseBody: |
            Universal build (Apple Silicon + Intel), ad-hoc signed, not notarized.
            First launch: right click → Open, or
            `xattr -dr com.apple.quarantine "/Applications/Cube Remote.app"`.
          releaseDraft: true
